apiVersion: v1
kind: Secret
metadata:
  name: crc-dev-env
  namespace: default
stringData:
  DATABASE_URL: postgres://teraxadmin:TeraX12340%23@terax-postgres-service:5432/crcdevdb
  PORT: 5221
  JWT_SECRET: f61b0048e7ecc1456badb69a872b51b6ad2f092041482dd5d19f3c3bafa8e25127aa6416bb88df3d0d44f157496184f195c31450
  CMS_HMAC_SECRET: cms_hmac_secret_change_me_2026
  CMS_BASE_URL: http://cms-service:5300
  TENANT_SUBDOMAIN: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crc-dev-deployment
  namespace: default
  labels:
    app: crc-dev-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crc-dev-app
  template:
    metadata:
      labels:
        app: crc-dev-app
    spec:
      containers:
        - name: crc-dev-app
          image: crc-dev-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5221
          envFrom:
            - secretRef:
                name: crc-dev-env
          resources:
            limits:
              memory: 1Gi
              cpu: 1000m
            requests:
              memory: 256Mi
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: crc-dev-service
  namespace: default
  labels:
    app: crc-dev-app
spec:
  type: LoadBalancer
  selector:
    app: crc-dev-app
  ports:
    - name: http
      port: 5222
      targetPort: 5221
      nodePort: 31411
      protocol: TCP

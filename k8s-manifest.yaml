    matchLabels:
      app: crc-web-app
  template:
    metadata:
      labels:
        app: crc-web-app
    spec:
      containers:
        - name: crc-web-app
          image: crc-web-app:latest
          imagePullPolicy: IfNotPresent
          ports:
